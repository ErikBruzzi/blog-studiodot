backend:
  name: git-gateway
  branch: main

# Onde as imagens que você subir pelo painel vão ficar salvas
media_folder: "blog/uploads"
public_folder: "/blog/uploads"

publish_mode: simple

collections:
  - name: "posts"
    label: "Posts do Blog"
    label_singular: "Post"
    folder: "content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de publicação", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Resumo (aparece na listagem)", name: "excerpt", widget: "text" }
      - { label: "Imagem de capa", name: "cover", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
